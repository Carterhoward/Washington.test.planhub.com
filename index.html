<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlanHub Washington Pricing Test Project Availability</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e5e5e5;padding:14px 24px;display:flex;align-items:center;gap:10px}
.pill{font-size:11px;background:#e8f5e9;color:#1b5e20;padding:3px 10px;border-radius:20px;font-weight:500;margin-left:auto}
.main{max-width:1100px;margin:0 auto;padding:20px 16px}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:18px 20px;margin-bottom:14px}
.card-title{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
label{display:block;font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
input[type=text],select{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;color:#1a1a1a;outline:none;background:#fff}
input[type=text]:focus,select:focus{border-color:#555}
.btn{padding:9px 22px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:#333}
.btn:disabled{background:#bbb;cursor:default}
.btn-sm{padding:5px 14px;font-size:12px;background:#fff;color:#1a1a1a;border:1px solid #ddd;border-radius:7px;cursor:pointer}
.btn-sm:hover{background:#f5f5f3}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:#f5f5f3;border-radius:8px;padding:13px 15px}
.stat-lbl{font-size:11px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.stat-val{font-size:24px;font-weight:600}
.stat-sub{font-size:11px;color:#aaa;margin-top:2px}
#map{height:450px;border-radius:8px;border:1px solid #e5e5e5}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.04em;padding:6px 10px;border-bottom:1px solid #e5e5e5;text-align:left}
.tbl td{padding:6px 10px;border-bottom:1px solid #f0f0f0}
.tbl tr:last-child td{border-bottom:none}
.tbl td:last-child{font-weight:600}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:500;background:#e8f5e9;color:#1b5e20}
.bar-wrap{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-label{font-size:12px;color:#444;width:170px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:#1a1a1a;border-radius:4px}
.bar-count{font-size:12px;font-weight:600;color:#333;min-width:28px;text-align:right}
.error{color:#c0392b;font-size:13px;margin-top:8px}
.scroll{max-height:280px;overflow-y:auto}
.section-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hidden{display:none}
.data-info{display:flex;align-items:center;gap:8px;background:#f5f5f3;border-radius:8px;padding:10px 14px;font-size:13px;color:#555;margin-bottom:14px}
@media(max-width:640px){
  .form-row{grid-template-columns:1fr 1fr}
  .form-row .btn{grid-column:1/-1}
  .stats-grid{grid-template-columns:1fr 1fr}
  .two-col{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="header">
  <img src="https://www.planhub.com/wp-content/uploads/2022/08/PlanHub-Logo.png" alt="PlanHub" style="height:36px;object-fit:contain;" onerror="this.style.display='none'">
  <div style="width:1px;height:28px;background:#e5e5e5;margin:0 4px"></div>
  <div>
    <div style="font-size:15px;font-weight:600;color:#1a1a1a">Washington Pricing Test</div>
    <div style="font-size:11px;color:#888;margin-top:1px">Project Availability</div>
  </div>
  <span class="pill">Washington State</span>
</div>

<div class="main">
  <div class="card">
    <div class="card-title">Search by Radius</div>
    <div class="data-info">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="#2e7d32" stroke-width="1.2"/><path d="M4.5 7l2 2 3-3" stroke="#2e7d32" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Data loaded: <strong id="loadedSummary">—</strong>
    </div>
    <div class="form-row">
      <div><label>Center ZIP Code</label><input type="text" id="zipInput" placeholder="e.g. 98101" maxlength="5"></div>
      <div><label>Radius (miles)</label>
        <select id="radiusInput">
          <option value="25">25 miles</option>
          <option value="50" selected>50 miles</option>
          <option value="75">75 miles</option>
          <option value="100">100 miles</option>
          <option value="150">150 miles</option>
          <option value="200">200 miles</option>
        </select>
      </div>
      <button class="btn" id="searchBtn" onclick="runSearch()">Search</button>
    </div>
    <div id="searchError" class="error hidden"></div>
  </div>

  <div id="resultsSection" class="hidden">
    <div class="stats-grid">
      <div class="stat"><div class="stat-lbl">Total Projects</div><div class="stat-val" id="statTotal">—</div><div class="stat-sub" id="statRadius"></div></div>
      <div class="stat"><div class="stat-lbl">ZIP Codes</div><div class="stat-val" id="statZips">—</div><div class="stat-sub">with projects</div></div>
      <div class="stat"><div class="stat-lbl">Avg per ZIP</div><div class="stat-val" id="statAvg">—</div><div class="stat-sub">projects</div></div>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <div style="padding:14px 18px 0">
        <div class="section-hdr">
          <div class="card-title" style="margin:0">Map View</div>
          <div style="font-size:11px;color:#aaa" id="mapSubtitle"></div>
        </div>
      </div>
      <div style="padding:0 16px 16px"><div id="map"></div></div>
    </div>
    <div class="two-col">
      <div class="card">
        <div class="section-hdr"><div class="card-title" style="margin:0">By Building Use</div><span id="buildingTotal" style="font-size:11px;color:#aaa"></span></div>
        <div id="buildingBars"></div>
      </div>
      <div class="card">
        <div class="section-hdr"><div class="card-title" style="margin:0">By Project Type</div><span id="projTypeTotal" style="font-size:11px;color:#aaa"></span></div>
        <div id="projTypeBars"></div>
      </div>
    </div>
    <div class="card">
      <div class="section-hdr">
        <div class="card-title" style="margin:0">ZIP Code Breakdown</div>
        <button class="btn-sm" onclick="exportCSV()">Export CSV</button>
      </div>
      <div class="scroll">
        <table class="tbl">
          <thead><tr><th>ZIP</th><th>City</th><th>Distance (mi)</th><th>Projects</th></tr></thead>
          <tbody id="zipTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

document.addEventListener('DOMContentLoaded', function(){
  var projectData = {};
  RAW.forEach(function(r){
    var zip=String(r[2]).trim(),projType=r[3],useType=r[4],city=r[1];
    if(!projectData[zip]) projectData[zip]={count:0,city:city,useTypes:{},projTypes:{}};
    projectData[zip].count++;
    if(useType) projectData[zip].useTypes[useType]=(projectData[zip].useTypes[useType]||0)+1;
    if(projType) projectData[zip].projTypes[projType]=(projectData[zip].projTypes[projType]||0)+1;
  });
  window.projectData = projectData;
  document.getElementById('loadedSummary').textContent = RAW.length + ' projects across ' + Object.keys(projectData).length + ' ZIP codes';
  document.getElementById('zipInput').addEventListener('keydown',function(e){if(e.key==='Enter')runSearch();});
});

function haversine(la1,lo1,la2,lo2){
  var R=3958.8,d=Math.PI/180;
  var a=Math.pow(Math.sin((la2-la1)*d/2),2)+Math.cos(la1*d)*Math.cos(la2*d)*Math.pow(Math.sin((lo2-lo1)*d/2),2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function showErr(id,msg){var e=document.getElementById(id);e.textContent=msg;e.classList.remove('hidden');}
function hideErr(id){document.getElementById(id).classList.add('hidden');}

var mbMap=null, searchResults=[];

function runSearch(){
  hideErr('searchError');
  var raw=document.getElementById('zipInput').value.trim().replace(/\D/g,'');
  var zip=raw.length===4?'0'+raw:raw;
  var radius=parseInt(document.getElementById('radiusInput').value);
  if(raw.length<4||raw.length>5){showErr('searchError','Please enter a valid 5-digit ZIP code.');return;}
  var center=COORDS[zip];
  if(!center){showErr('searchError','ZIP code '+zip+' not found. Try a nearby ZIP.');return;}

  var btn=document.getElementById('searchBtn');
  btn.disabled=true; btn.textContent='Searching…';

  searchResults=[];
  Object.keys(projectData).forEach(function(z){
    var c=COORDS[z]; if(!c) return;
    var dist=haversine(center[0],center[1],c[0],c[1]);
    if(dist<=radius) searchResults.push({zip:z,dist:Math.round(dist*10)/10,data:projectData[z],coords:c});
  });
  searchResults.sort(function(a,b){return a.dist-b.dist;});

  var total=searchResults.reduce(function(s,r){return s+r.data.count;},0);
  var avg=searchResults.length?Math.round(total/searchResults.length):0;
  document.getElementById('statTotal').textContent=total.toLocaleString();
  document.getElementById('statRadius').textContent='within '+radius+' mi of '+zip;
  document.getElementById('statZips').textContent=searchResults.length;
  document.getElementById('statAvg').textContent=avg;
  document.getElementById('mapSubtitle').textContent=radius+'-mile radius from ZIP '+zip;
  document.getElementById('resultsSection').classList.remove('hidden');

  var useAgg={},ptAgg={};
  searchResults.forEach(function(r){
    Object.keys(r.data.useTypes).forEach(function(k){useAgg[k]=(useAgg[k]||0)+r.data.useTypes[k];});
    Object.keys(r.data.projTypes).forEach(function(k){ptAgg[k]=(ptAgg[k]||0)+r.data.projTypes[k];});
  });
  renderBars('buildingBars',useAgg,10,'buildingTotal');
  renderBars('projTypeBars',ptAgg,10,'projTypeTotal');

  var tbody=document.getElementById('zipTableBody');
  tbody.innerHTML='';
  if(!searchResults.length){
    tbody.innerHTML='<tr><td colspan="4" style="text-align:center;padding:30px;color:#bbb">No results.</td></tr>';
  } else {
    searchResults.forEach(function(r){
      var tr=document.createElement('tr');
      tr.innerHTML='<td><span class="badge">'+r.zip+'</span></td><td style="color:#666">'+r.data.city+'</td><td>'+r.dist+'</td><td>'+r.data.count+'</td>';
      tbody.appendChild(tr);
    });
  }

  if(mbMap){mbMap.remove();mbMap=null;}
  mbMap=new mapboxgl.Map({
    container:'map',
    style:'mapbox://styles/mapbox/light-v11',
    center:[center[1],center[0]],
    zoom:7
  });

  mbMap.on('load',function(){
    var mx=Math.max.apply(null,searchResults.map(function(r){return r.data.count;}));
    if(mx<1) mx=1;
    searchResults.forEach(function(r){
      var pct=r.data.count/mx;
      var sz=Math.max(10,Math.round(10+pct*18));
      var el=document.createElement('div');
      el.style.width=sz+'px';
      el.style.height=sz+'px';
      el.style.background='rgba(46,125,50,'+(0.55+pct*0.4).toFixed(2)+')';
      el.style.border='2px solid #fff';
      el.style.borderRadius='50%';
      el.style.boxShadow='0 1px 4px rgba(0,0,0,.3)';
      el.style.cursor='pointer';
      var topUse=Object.keys(r.data.useTypes).sort(function(a,b){return r.data.useTypes[b]-r.data.useTypes[a];})[0];
      new mapboxgl.Marker({element:el})
        .setLngLat([r.coords[1],r.coords[0]])
        .setPopup(new mapboxgl.Popup({offset:10}).setHTML('<b>'+r.zip+'</b> · '+r.data.city+'<br>'+r.data.count+' project'+(r.data.count!==1?'s':'')+' · '+r.dist+' mi'+(topUse?'<br>Top: '+topUse:'')))
        .addTo(mbMap);
    });

    var cEl=document.createElement('div');
    cEl.style.width='14px'; cEl.style.height='14px';
    cEl.style.background='#1a1a1a'; cEl.style.border='2px solid #fff';
    cEl.style.borderRadius='50%'; cEl.style.boxShadow='0 2px 6px rgba(0,0,0,.4)';
    new mapboxgl.Marker({element:cEl}).setLngLat([center[1],center[0]])
      .setPopup(new mapboxgl.Popup().setHTML('<b>Center: '+zip+'</b>')).addTo(mbMap);

    var km=radius*1.60934;
    var dlat=km/111.32;
    var dlng=km/(111.32*Math.cos(center[0]*Math.PI/180));
    mbMap.fitBounds([[center[1]-dlng,center[0]-dlat],[center[1]+dlng,center[0]+dlat]],{padding:40});
  });

  btn.disabled=false; btn.textContent='Search';
}

function renderBars(id,agg,topN,totalId){
  var el=document.getElementById(id);
  var sorted=Object.keys(agg).map(function(k){return[k,agg[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,topN);
  var max=sorted.length?sorted[0][1]:1;
  var grand=Object.keys(agg).reduce(function(s,k){return s+agg[k];},0);
  document.getElementById(totalId).textContent=grand+' total';
  if(!sorted.length){el.innerHTML='<div style="font-size:13px;color:#aaa;padding:8px 0">No data</div>';return;}
  el.innerHTML=sorted.map(function(kv){
    return '<div class="bar-wrap"><div class="bar-label" title="'+kv[0]+'">'+kv[0]+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(kv[1]/max*100)+'%"></div></div><div class="bar-count">'+kv[1]+'</div></div>';
  }).join('');
}

function exportCSV(){
  if(!searchResults.length) return;
  var zip=document.getElementById('zipInput').value.trim();
  var radius=document.getElementById('radiusInput').value;
  var csv='ZIP Code,City,Distance (mi),Projects\n';
  searchResults.forEach(function(r){csv+=r.zip+',"'+r.data.city+'",'+r.dist+','+r.data.count+'\n';});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='projects_'+zip+'_'+radius+'mi.csv';
  a.click();
}

document.getElementById('zipInput').addEventListener('keydown',function(e){if(e.key==='Enter')runSearch();});
